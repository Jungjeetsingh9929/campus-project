services:
  - type: web
    name: campus-digital-twin-api
    runtime: docker
    rootDir: backend/CampusDigitalTwin.Api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Issuer
        value: CampusDigitalTwin
      - key: Jwt__Audience
        value: CampusDigitalTwinWeb
      - key: Jwt__SigningKey
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-digital-twin-db
          property: connectionString
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Frontend__BaseUrl
        sync: false
      - key: SeedUsers__DefaultPassword
        sync: false
      - key: SMTP__HOST
        sync: false
      - key: SMTP__PORT
        value: 587
      - key: SMTP__USERNAME
        sync: false
      - key: SMTP__PASSWORD
        sync: false
      - key: SMTP__FROM
        sync: false

  - type: web
    name: campus-digital-twin-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campus-digital-twin-api.onrender.com/api
      - key: VITE_ENABLE_LIVE_API
        value: true
      - key: VITE_ENABLE_DEMO_FALLBACKS
        value: false

databases:
  - name: campus-digital-twin-db
    databaseName: campus_digital_twin
    user: campus
